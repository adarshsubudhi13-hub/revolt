server:
  port: 8085

spring:
  application:
    name: revolt-platform

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB

  h2:
    console:
      enabled: true
      path: /h2-console

---
# Development Profile (Default, Out-of-the-box File Database)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/revoltdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# Production / MySQL Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/revolt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: rootpassword
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# Application Specific Properties
revolt:
  jwt:
    secret: 9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  storage:
    upload-dir: ./uploads
  valuation:
    points-per-rupee: 1
    max-redemption-percent: 30
    price-lock-days: 7
