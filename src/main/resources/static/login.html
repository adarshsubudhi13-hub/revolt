<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register - ReVolt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="container" style="padding: 50px 20px; max-width: 520px;">
    
    <div class="card">
      <div style="text-align:center; margin-bottom:24px;">
        <div class="brand-icon" style="margin: 0 auto 12px; width:48px; height:48px; font-size:1.5rem;">⚡</div>
        <h2 style="font-size:1.6rem; letter-spacing:-0.5px;">Welcome to ReVolt</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Electronics Circular Trade-in Platform</p>
      </div>

      <!-- Quick Demo Persona Switcher (Convenient 1-Click Testing) -->
      <div style="background:var(--bg-main); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:14px; margin-bottom:24px;">
        <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:8px;">
          ⚡ Quick 1-Click Demo Login
        </span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary btn-sm" style="flex:1; font-size:0.8rem;" onclick="quickLogin('rohit@example.com', 'user123')">
            👤 Customer
          </button>
          <button class="btn btn-secondary btn-sm" style="flex:1; font-size:0.8rem;" onclick="quickLogin('agent@revolt.com', 'agent123')">
            🛵 Agent
          </button>
          <button class="btn btn-secondary btn-sm" style="flex:1; font-size:0.8rem;" onclick="quickLogin('admin@revolt.com', 'admin123')">
            ⚙️ Admin
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <div style="display:flex; border-bottom:1px solid var(--border-color); margin-bottom:20px;">
        <button id="tab-login-btn" class="btn btn-secondary" style="flex:1; border-radius:0; border:none; border-bottom:2px solid var(--primary);" onclick="switchAuthTab('login')">
          Sign In
        </button>
        <button id="tab-register-btn" class="btn btn-secondary" style="flex:1; border-radius:0; border:none;" onclick="switchAuthTab('register')">
          New Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email or Phone Number</label>
          <input type="text" id="login-identifier" class="form-control" placeholder="name@example.com or 9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
          Sign In to ReVolt &rarr;
        </button>
      </form>

      <!-- Registration Form -->
      <form id="form-register" style="display:none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Rohit Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="rohit@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" maxlength="10" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
          Send Verification OTPs &rarr;
        </button>
      </form>
    </div>

  </div>

  <!-- Dual OTP Verification Modal -->
  <div id="otp-modal" class="modal-overlay">
    <div class="modal" style="max-width:440px;">
      <div style="text-align:center; margin-bottom:16px;">
        <span style="font-size:2rem;">📩</span>
        <h3 style="margin-top:8px;">Dual-Factor Verification</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
          Enter the 6-digit OTP dispatched to <b id="otp-target-email">your email</b>
        </p>
      </div>

      <div class="form-group" style="text-align:center;">
        <input type="text" id="otp-code-input" class="form-control" placeholder="6-digit OTP (e.g. 123456)" maxlength="6" style="text-align:center; font-size:1.6rem; letter-spacing:6px; font-weight:800;">
        <span style="font-size:0.75rem; color:var(--text-muted); display:block; margin-top:8px;">
          💡 For testing, you can use master dev OTP: <b>123456</b>
        </span>
      </div>

      <button class="btn btn-primary btn-block btn-lg" onclick="submitOtpVerification()">
        Verify & Activate Account
      </button>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:0.85rem;">
        <span style="color:var(--text-muted);">Valid for 5 minutes</span>
        <a href="#" style="color:var(--primary); font-weight:600; text-decoration:none;" onclick="resendOtp()">Resend OTP</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
